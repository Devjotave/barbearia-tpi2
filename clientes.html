<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Clientes | Barbearia do Rafa</title><link rel="stylesheet" href="css/style.css"></head>
<body data-protected="true" data-module="clientes">
<header class="barra-interna"><div class="container nav"><a class="logo" href="index.html">Barbearia do Rafa</a><div class="nav-acoes"><a href="index.html">Início</a><span data-user-name></span><button class="link-botao" type="button" data-logout>Sair</button></div></div></header>
<main class="container formulario-pagina">
<div class="titulo-secao"><p class="destaque">Cadastro e consulta</p><h1>Clientes</h1><p>Os registros são gravados e consultados diretamente no banco de dados.</p></div>
<form class="formulario" data-endpoint="php/clientes.php"><input type="hidden" name="id" id="id">
<div class="campo campo-largo"><label for="nome">Nome completo</label><input id="nome" name="nome" type="text" minlength="3" maxlength="100" required></div>
<div class="campo"><label for="cpf">CPF</label><input id="cpf" name="cpf" type="text" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" data-mask="cpf" required></div>
<div class="campo"><label for="nascimento">Data de nascimento</label><input id="nascimento" name="nascimento" type="date" required></div>
<div class="campo"><label for="telefone">Telefone</label><input id="telefone" name="telefone" type="tel" maxlength="15" placeholder="(34) 99999-9999" data-mask="telefone" required></div>
<div class="campo"><label for="email">E-mail</label><input id="email" name="email" type="email" maxlength="120" required></div>
<div class="campo campo-largo"><label for="observacoes">Observações</label><textarea id="observacoes" name="observacoes" rows="3" minlength="3" maxlength="300" required></textarea></div>
<div class="acoes campo-largo"><button class="botao" type="submit" data-submit-label>Salvar cliente</button><button class="botao botao-secundario" type="button" data-cancel-edit>Limpar</button></div>
<div class="mensagem campo-largo" role="status" aria-live="polite"></div></form>
<section class="lista-secao"><div class="titulo-lista"><h2>Clientes cadastrados</h2><button class="botao botao-secundario" type="button" data-refresh>Atualizar lista</button></div><div class="tabela-wrap"><table><thead><tr><th>Nome</th><th>CPF</th><th>Telefone</th><th>E-mail</th><th>Idade</th><th>Ações</th></tr></thead><tbody id="listaRegistros"></tbody></table></div></section>
</main><script src="js/common.js" defer></script><script src="js/app.js" defer></script></body></html>
