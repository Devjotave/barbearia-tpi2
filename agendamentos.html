<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Agendamentos | Barbearia do Rafa</title><link rel="stylesheet" href="css/style.css"></head>
<body data-protected="true" data-module="agendamentos">
<header class="barra-interna"><div class="container nav"><a class="logo" href="index.html">Barbearia do Rafa</a><div class="nav-acoes"><a href="index.html">Início</a><span data-user-name></span><button class="link-botao" type="button" data-logout>Sair</button></div></div></header>
<main class="container formulario-pagina"><div class="titulo-secao"><p class="destaque">Cadastro e consulta</p><h1>Agendamentos</h1><p>O cliente, o barbeiro e o serviço são carregados diretamente do banco.</p></div>
<form class="formulario" data-endpoint="php/agendamentos.php"><input type="hidden" name="id" id="id">
<div class="campo campo-largo"><label for="cliente_id">Cliente</label><select id="cliente_id" name="cliente_id" data-options="clientes" required><option value="">Carregando...</option></select></div>
<div class="campo"><label for="barbeiro_id">Barbeiro</label><select id="barbeiro_id" name="barbeiro_id" data-options="barbeiros" required><option value="">Carregando...</option></select></div>
<div class="campo"><label for="servico_id">Serviço</label><select id="servico_id" name="servico_id" data-options="servicos" required><option value="">Carregando...</option></select></div>
<div class="campo"><label for="data">Data</label><input id="data" name="data" type="date" data-min-today required></div>
<div class="campo"><label for="horario">Horário</label><input id="horario" name="horario" type="time" min="08:00" max="19:00" required></div>
<div class="campo"><label for="confirmacao">Forma de confirmação</label><select id="confirmacao" name="confirmacao" required><option value="">Selecione</option><option>WhatsApp</option><option>Telefone</option><option>E-mail</option></select></div>
<div class="campo"><label for="status">Status</label><select id="status" name="status" required><option>Agendado</option><option>Confirmado</option><option>Concluído</option><option>Cancelado</option></select></div>
<div class="campo campo-largo"><label for="observacoes">Observações</label><textarea id="observacoes" name="observacoes" rows="3" minlength="3" maxlength="300" required></textarea></div>
<div class="acoes campo-largo"><button class="botao" type="submit" data-submit-label>Salvar agendamento</button><button class="botao botao-secundario" type="button" data-cancel-edit>Limpar</button></div><div class="mensagem campo-largo" role="status" aria-live="polite"></div></form>
<section class="lista-secao"><div class="titulo-lista"><h2>Agendamentos cadastrados</h2><button class="botao botao-secundario" type="button" data-refresh>Atualizar lista</button></div><div class="tabela-wrap"><table><thead><tr><th>Data</th><th>Cliente</th><th>Barbeiro</th><th>Serviço</th><th>Confirmação</th><th>Status</th><th>Ações</th></tr></thead><tbody id="listaRegistros"></tbody></table></div></section>
</main><script src="js/common.js" defer></script><script src="js/app.js" defer></script></body></html>
