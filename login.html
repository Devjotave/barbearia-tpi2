<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Barbearia do Rafa</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-login">
    <main class="login-wrapper">
        <section class="login-card">
            <p class="marca-tag">SISTEMA ADMINISTRATIVO</p>
            <h1>Barbearia do Rafa</h1>
            <p class="texto-muted">Entre com um usuário cadastrado no banco de dados.</p>

            <form id="formLogin" class="formulario formulario-login" novalidate>
                <div class="campo campo-largo">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" autocomplete="username" required>
                </div>
                <div class="campo campo-largo">
                    <label for="senha">Senha</label>
                    <input id="senha" name="senha" type="password" autocomplete="current-password" minlength="6" required>
                </div>
                <div class="acoes campo-largo">
                    <button class="botao" type="submit">Entrar</button>
                </div>
                <div id="mensagemLogin" class="mensagem campo-largo" role="status" aria-live="polite"></div>
            </form>

            <div class="credencial-demo">
                <strong>Acesso inicial:</strong>
                <span>admin@barbearia.local</span>
                <span>Senha: Admin@123</span>
            </div>
        </section>
    </main>
    <script src="js/login.js" defer></script>
</body>
</html>
