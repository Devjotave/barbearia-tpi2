<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos | Barbearia do Rafa</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="barra-interna">
        <div class="container nav">
            <a class="logo" href="index.html">Barbearia do Rafa</a>
            <a href="index.html">Voltar ao início</a>
        </div>
    </header>

    <main class="container formulario-pagina">
        <div class="titulo-secao">
            <p class="destaque">Cadastro</p>
            <h1>Produto</h1>
            <p>Cadastre produtos de uso interno ou destinados à venda.</p>
        </div>

        <form class="formulario" data-endpoint="php/produtos.php">
            <tpi2>
                <div class="campo campo-largo">
                    <label for="nome">Nome do produto</label>
                    <input id="nome" name="nome" type="text" minlength="2" maxlength="100" required>
                </div>

                <div class="campo">
                    <label for="categoria">Categoria</label>
                    <select id="categoria" name="categoria" required>
                        <option value="">Selecione</option>
                        <option value="Shampoo">Shampoo</option>
                        <option value="Pomada">Pomada</option>
                        <option value="Óleo">Óleo</option>
                        <option value="Higiene">Higiene</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="marca">Marca</label>
                    <input id="marca" name="marca" type="text" maxlength="80" required>
                </div>

                <div class="campo">
                    <label for="estoque">Quantidade em estoque</label>
                    <input id="estoque" name="estoque" type="number" min="0" max="9999" required>
                </div>

                <div class="campo">
                    <label for="preco">Preço unitário (R$)</label>
                    <input id="preco" name="preco" type="number" min="0.01" step="0.01" required>
                </div>

                <div class="campo campo-largo">
                    <label for="fornecedor">Fornecedor</label>
                    <input id="fornecedor" name="fornecedor" type="text" maxlength="120" required>
                </div>

                <div class="acoes campo-largo">
                    <button class="botao" type="submit">Enviar cadastro</button>
                    <button class="botao botao-secundario" type="reset">Limpar</button>
                </div>

                <div class="mensagem campo-largo" role="status" aria-live="polite"></div>
        
            </tpi2>
        </form>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
