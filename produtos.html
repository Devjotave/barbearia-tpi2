<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Produtos | Barbearia do Rafa</title><link rel="stylesheet" href="css/style.css"></head>
<body data-protected="true" data-module="produtos">
<header class="barra-interna"><div class="container nav"><a class="logo" href="index.html">Barbearia do Rafa</a><div class="nav-acoes"><a href="index.html">Início</a><span data-user-name></span><button class="link-botao" type="button" data-logout>Sair</button></div></div></header>
<main class="container formulario-pagina"><div class="titulo-secao"><p class="destaque">Cadastro e consulta</p><h1>Produtos</h1><p>Controle produtos de uso interno ou destinados à venda.</p></div>
<form class="formulario" data-endpoint="php/produtos.php"><input type="hidden" name="id" id="id">
<div class="campo campo-largo"><label for="nome">Nome do produto</label><input id="nome" name="nome" type="text" minlength="2" maxlength="100" required></div>
<div class="campo"><label for="categoria">Categoria</label><select id="categoria" name="categoria" required><option value="">Selecione</option><option>Shampoo</option><option>Pomada</option><option>Óleo</option><option>Higiene</option><option>Outro</option></select></div>
<div class="campo"><label for="marca">Marca</label><input id="marca" name="marca" type="text" maxlength="80" required></div>
<div class="campo"><label for="estoque">Quantidade em estoque</label><input id="estoque" name="estoque" type="number" min="0" max="9999" required></div>
<div class="campo"><label for="preco">Preço unitário (R$)</label><input id="preco" name="preco" type="number" min="0.01" step="0.01" required></div>
<div class="campo"><label for="ativo">Situação</label><select id="ativo" name="ativo" required><option value="1">Ativo</option><option value="0">Inativo</option></select></div>
<div class="campo campo-largo"><label for="fornecedor">Fornecedor</label><input id="fornecedor" name="fornecedor" type="text" maxlength="120" required></div>
<div class="acoes campo-largo"><button class="botao" type="submit" data-submit-label>Salvar produto</button><button class="botao botao-secundario" type="button" data-cancel-edit>Limpar</button></div><div class="mensagem campo-largo" role="status" aria-live="polite"></div></form>
<section class="lista-secao"><div class="titulo-lista"><h2>Produtos cadastrados</h2><button class="botao botao-secundario" type="button" data-refresh>Atualizar lista</button></div><div class="tabela-wrap"><table><thead><tr><th>Produto</th><th>Categoria</th><th>Estoque</th><th>Preço</th><th>Valor estoque</th><th>Situação</th><th>Ações</th></tr></thead><tbody id="listaRegistros"></tbody></table></div></section>
</main><script src="js/common.js" defer></script><script src="js/app.js" defer></script></body></html>
