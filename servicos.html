<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Serviços | Barbearia do Rafa</title><link rel="stylesheet" href="css/style.css"></head>
<body data-protected="true" data-module="servicos">
<header class="barra-interna"><div class="container nav"><a class="logo" href="index.html">Barbearia do Rafa</a><div class="nav-acoes"><a href="index.html">Início</a><span data-user-name></span><button class="link-botao" type="button" data-logout>Sair</button></div></div></header>
<main class="container formulario-pagina"><div class="titulo-secao"><p class="destaque">Cadastro e consulta</p><h1>Serviços</h1><p>Defina os serviços oferecidos pela barbearia.</p></div>
<form class="formulario" data-endpoint="php/servicos.php"><input type="hidden" name="id" id="id">
<div class="campo campo-largo"><label for="nome">Nome do serviço</label><input id="nome" name="nome" type="text" minlength="3" maxlength="100" required></div>
<div class="campo"><label for="categoria">Categoria</label><select id="categoria" name="categoria" required><option value="">Selecione</option><option>Cabelo</option><option>Barba</option><option>Combo</option><option>Tratamento</option></select></div>
<div class="campo"><label for="duracao">Duração (minutos)</label><input id="duracao" name="duracao" type="number" min="10" max="240" required></div>
<div class="campo"><label for="preco">Preço (R$)</label><input id="preco" name="preco" type="number" min="1" step="0.01" required></div>
<div class="campo"><label for="nivel">Nível de demanda</label><select id="nivel" name="nivel" required><option value="">Selecione</option><option>Baixa</option><option>Média</option><option>Alta</option></select></div>
<div class="campo"><label for="ativo">Situação</label><select id="ativo" name="ativo" required><option value="1">Ativo</option><option value="0">Inativo</option></select></div>
<div class="campo campo-largo"><label for="descricao">Descrição</label><textarea id="descricao" name="descricao" rows="3" minlength="5" maxlength="300" required></textarea></div>
<div class="acoes campo-largo"><button class="botao" type="submit" data-submit-label>Salvar serviço</button><button class="botao botao-secundario" type="button" data-cancel-edit>Limpar</button></div><div class="mensagem campo-largo" role="status" aria-live="polite"></div></form>
<section class="lista-secao"><div class="titulo-lista"><h2>Serviços cadastrados</h2><button class="botao botao-secundario" type="button" data-refresh>Atualizar lista</button></div><div class="tabela-wrap"><table><thead><tr><th>Nome</th><th>Categoria</th><th>Duração</th><th>Preço</th><th>Demanda</th><th>Situação</th><th>Ações</th></tr></thead><tbody id="listaRegistros"></tbody></table></div></section>
</main><script src="js/common.js" defer></script><script src="js/app.js" defer></script></body></html>
