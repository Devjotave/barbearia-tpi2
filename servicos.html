<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviços | Barbearia do Rafa</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="barra-interna">
        <div class="container nav">
            <a class="logo" href="index.html">Barbearia do Rafa</a>
            <a href="index.html">Voltar ao início</a>
        </div>
    </header>

    <main class="container formulario-pagina">
        <div class="titulo-secao">
            <p class="destaque">Cadastro</p>
            <h1>Serviço</h1>
            <p>Defina os serviços oferecidos pela barbearia.</p>
        </div>

        <form class="formulario" data-endpoint="php/servicos.php">
            <div class="campo campo-largo">
                <label for="nome">Nome do serviço</label>
                <input id="nome" name="nome" type="text" minlength="3" maxlength="100" required>
            </div>

            <div class="campo">
                <label for="categoria">Categoria</label>
                <select id="categoria" name="categoria" required>
                    <option value="">Selecione</option>
                    <option value="Cabelo">Cabelo</option>
                    <option value="Barba">Barba</option>
                    <option value="Combo">Combo</option>
                    <option value="Tratamento">Tratamento</option>
                </select>
            </div>

            <div class="campo">
                <label for="duracao">Duração (minutos)</label>
                <input id="duracao" name="duracao" type="number" min="10" max="240" required>
            </div>

            <div class="campo">
                <label for="preco">Preço (R$)</label>
                <input id="preco" name="preco" type="number" min="1" step="0.01" required>
            </div>

            <div class="campo">
                <label for="nivel">Nível de demanda</label>
                <select id="nivel" name="nivel" required>
                    <option value="">Selecione</option>
                    <option value="Baixa">Baixa</option>
                    <option value="Média">Média</option>
                    <option value="Alta">Alta</option>
                </select>
            </div>

            <div class="campo campo-largo">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" name="descricao" rows="4" minlength="5" maxlength="300" required></textarea>
            </div>

            <div class="acoes campo-largo">
                <button class="botao" type="submit">Enviar cadastro</button>
                <button class="botao botao-secundario" type="reset">Limpar</button>
            </div>

            <div class="mensagem campo-largo" role="status" aria-live="polite"></div>
        </form>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
